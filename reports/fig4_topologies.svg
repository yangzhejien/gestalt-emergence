<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="26" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">图 4 · 实验设计：三层拓扑中跨层连接密度的递进操控</text>

  <!-- ============ tree (panel 1) ============ -->
  <text x="125" y="315" fill="#334155" font-size="12.5" font-weight="700" text-anchor="middle">tree：0 横向边 / 1 跳</text>
  <!-- edges -->
  <line x1="125" y1="61" x2="125" y2="126" stroke="#64748b" stroke-width="1.5"/>
  <line x1="125" y1="154" x2="80" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <line x1="125" y1="154" x2="125" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <line x1="125" y1="154" x2="170" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <!-- nodes -->
  <circle cx="125" cy="45" r="16" fill="#d97706"/><text x="125" y="49" fill="#fff" font-size="10" text-anchor="middle">7B</text>
  <circle cx="125" cy="140" r="14" fill="#2563eb"/><text x="125" y="144" fill="#fff" font-size="9.5" text-anchor="middle">3B</text>
  <circle cx="80" cy="250" r="11" fill="#94a3b8"/><text x="80" y="253" fill="#fff" font-size="8.5" text-anchor="middle">1.5</text>
  <circle cx="125" cy="250" r="11" fill="#94a3b8"/><text x="125" y="253" fill="#fff" font-size="8.5" text-anchor="middle">1.5</text>
  <circle cx="170" cy="250" r="11" fill="#94a3b8"/><text x="170" y="253" fill="#fff" font-size="8.5" text-anchor="middle">1.5</text>

  <!-- ============ mesh (panel 2) ============ -->
  <text x="360" y="315" fill="#334155" font-size="12.5" font-weight="700" text-anchor="middle">mesh：L2 全连 / 2 跳</text>
  <line x1="360" y1="61" x2="335" y2="127" stroke="#64748b" stroke-width="1.5"/>
  <line x1="360" y1="61" x2="385" y2="127" stroke="#64748b" stroke-width="1.5"/>
  <line x1="335" y1="140" x2="385" y2="140" stroke="#64748b" stroke-width="1.5"/>
  <line x1="335" y1="154" x2="310" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <line x1="335" y1="154" x2="360" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <line x1="385" y1="154" x2="410" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <line x1="385" y1="154" x2="360" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="360" cy="45" r="16" fill="#d97706"/><text x="360" y="49" fill="#fff" font-size="10" text-anchor="middle">7B</text>
  <circle cx="335" cy="140" r="13" fill="#2563eb"/><text x="335" y="143" fill="#fff" font-size="9" text-anchor="middle">3B</text>
  <circle cx="385" cy="140" r="13" fill="#2563eb"/><text x="385" y="143" fill="#fff" font-size="9" text-anchor="middle">3B</text>
  <circle cx="310" cy="250" r="11" fill="#94a3b8"/><text x="310" y="253" fill="#fff" font-size="8.5" text-anchor="middle">1.5</text>
  <circle cx="360" cy="250" r="11" fill="#94a3b8"/><text x="360" y="253" fill="#fff" font-size="8.5" text-anchor="middle">1.5</text>
  <circle cx="410" cy="250" r="11" fill="#94a3b8"/><text x="410" y="253" fill="#fff" font-size="8.5" text-anchor="middle">1.5</text>

  <!-- ============ full (panel 3) ============ -->
  <text x="600" y="315" fill="#334155" font-size="12.5" font-weight="700" text-anchor="middle">full：L3 集群内全连 / 2 跳</text>
  <line x1="600" y1="61" x2="575" y2="127" stroke="#64748b" stroke-width="1.5"/>
  <line x1="600" y1="61" x2="625" y2="127" stroke="#64748b" stroke-width="1.5"/>
  <line x1="575" y1="140" x2="625" y2="140" stroke="#64748b" stroke-width="1.5"/>
  <line x1="575" y1="154" x2="550" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <line x1="575" y1="154" x2="600" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <line x1="625" y1="154" x2="650" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <line x1="625" y1="154" x2="600" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <!-- L3 internal lateral edges (full) -->
  <line x1="550" y1="250" x2="600" y2="250" stroke="#dc2626" stroke-width="2"/>
  <line x1="600" y1="250" x2="650" y2="250" stroke="#dc2626" stroke-width="2"/>
  <line x1="550" y1="250" x2="650" y2="250" stroke="#dc2626" stroke-width="2" opacity="0.4"/>
  <circle cx="600" cy="45" r="16" fill="#d97706"/><text x="600" y="49" fill="#fff" font-size="10" text-anchor="middle">7B</text>
  <circle cx="575" cy="140" r="13" fill="#2563eb"/><text x="575" y="143" fill="#fff" font-size="9" text-anchor="middle">3B</text>
  <circle cx="625" cy="140" r="13" fill="#2563eb"/><text x="625" y="143" fill="#fff" font-size="9" text-anchor="middle">3B</text>
  <circle cx="550" cy="250" r="11" fill="#94a3b8"/><text x="550" y="253" fill="#fff" font-size="8.5" text-anchor="middle">1.5</text>
  <circle cx="600" cy="250" r="11" fill="#94a3b8"/><text x="600" y="253" fill="#fff" font-size="8.5" text-anchor="middle">1.5</text>
  <circle cx="650" cy="250" r="11" fill="#94a3b8"/><text x="650" y="253" fill="#fff" font-size="8.5" text-anchor="middle">1.5</text>

  <text x="360" y="335" fill="#64748b" font-size="10.5" text-anchor="middle">红色横线 = L3 集群内横向连接（仅 full 档存在）；横向边数 tree(0) &lt; mesh &lt; full，构成对 Ŵ 的隔离操控</text>
</svg>
