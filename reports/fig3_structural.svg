<svg viewBox="0 0 640 390" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="640" height="390" fill="#ffffff"/>
  <text x="320" y="26" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">图 3 · 结构性跨层涌现：集体 &gt; 纯投票，但亚临界下仍不及最强单体</text>
  <!-- axes -->
  <line x1="60" y1="40" x2="60" y2="330" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="330" x2="600" y2="330" stroke="#334155" stroke-width="1.5"/>
  <text x="54" y="44" fill="#64748b" font-size="11" text-anchor="end">0.8</text>
  <text x="54" y="170" fill="#64748b" font-size="11" text-anchor="end">0.6</text>
  <text x="54" y="330" fill="#64748b" font-size="11" text-anchor="end">0.0</text>
  <text x="320" y="372" fill="#334155" font-size="12.5" text-anchor="middle">拓扑（tree → mesh → full@12）</text>
  <text x="20" y="185" fill="#334155" font-size="12.5" text-anchor="middle" transform="rotate(-90 20 185)">准确率</text>

  <!-- y gridlines -->
  <line x1="60" y1="170" x2="600" y2="170" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="60" y1="250" x2="600" y2="250" stroke="#e2e8f0" stroke-width="1"/>

  <!-- solo 7B reference line -->
  <line x1="60" y1="100.0" x2="600" y2="100.0" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="596" y="94" fill="#d97706" font-size="11" text-anchor="end">solo 7B (最强单体 = 0.74)</text>

  <!-- tree group (x=140) -->
  <rect x="118" y="128" width="34" height="202" fill="#2563eb"/>
  <rect x="158" y="160" width="34" height="170" fill="#94a3b8"/>
  <text x="140" y="350" fill="#334155" font-size="11.5" text-anchor="middle">tree@12</text>
  <text x="135" y="120" fill="#1e40af" font-size="10" text-anchor="middle">0.58</text>
  <text x="175" y="152" fill="#475569" font-size="10" text-anchor="middle">0.50</text>

  <!-- mesh group (x=320) -->
  <rect x="298" y="152" width="34" height="178" fill="#2563eb"/>
  <rect x="338" y="160" width="34" height="170" fill="#94a3b8"/>
  <text x="320" y="350" fill="#334155" font-size="11.5" text-anchor="middle">mesh@12</text>
  <text x="315" y="144" fill="#1e40af" font-size="10" text-anchor="middle">0.52</text>
  <text x="355" y="152" fill="#475569" font-size="10" text-anchor="middle">0.50</text>

  <!-- full group (x=500) -->
  <rect x="478" y="101.6" width="34" height="228.4" fill="#2563eb"/>
  <rect x="518" y="160" width="34" height="170" fill="#94a3b8"/>
  <text x="500" y="350" fill="#334155" font-size="11.5" text-anchor="middle">full@12</text>
  <text x="495" y="93.6" fill="#1e40af" font-size="10" text-anchor="middle">0.65</text>
  <text x="535" y="152" fill="#475569" font-size="10" text-anchor="middle">0.50</text>

  <!-- legend -->
  <rect x="380" y="44" width="14" height="12" fill="#2563eb"/>
  <text x="400" y="54" fill="#334155" font-size="11">集体（跨层协作）</text>
  <rect x="380" y="62" width="14" height="12" fill="#94a3b8"/>
  <text x="400" y="72" fill="#334155" font-size="11">委员会0（纯 L3 投票）</text>

  <text x="320" y="388" fill="#64748b" font-size="10.5" text-anchor="middle">蓝 &gt; 灰 在所有密度下成立 = 跨层乘法结构涌现；蓝/灰均低于橙线 = 亚临界下尚无超线性涌现</text>
</svg>
